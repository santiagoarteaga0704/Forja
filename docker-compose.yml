services:
  db:
    image: postgres:17-alpine
    container_name: forja-db
    environment:
      POSTGRES_DB: forja
      POSTGRES_USER: forja
      POSTGRES_PASSWORD: forja_dev
    ports:
      - "5433:5432"
    volumes:
      - forja-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forja -d forja"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forja-pgdata:
