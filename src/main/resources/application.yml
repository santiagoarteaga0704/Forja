spring:
  application:
    name: forja-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/forja
    username: forja
    password: forja_dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    bo.forja: DEBUG
