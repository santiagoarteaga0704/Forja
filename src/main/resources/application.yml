spring:
  application:
    name: forja-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/forja
    username: forja
    password: forja_dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      # La foto de una pizarra sacada con un telefono pesa varios megas. El
      # limite por omision es uno y rechazaria casi cualquier foto real.
      max-file-size: 15MB
      max-request-size: 15MB

forja:
  jwt:
    # En el despliegue se sobrescribe con la variable de entorno
    # FORJA_JWT_SECRETO. HS256 exige 32 caracteres como minimo.
    secreto: ${FORJA_JWT_SECRETO:clave-de-desarrollo-de-forja-no-usar-en-produccion}
    vigencia-horas: 12
  web:
    # Origenes del cliente React. Vite sirve en 5173 durante el desarrollo.
    origenes: http://localhost:5173,http://localhost:4173
  bloqueo:
    vigencia-segundos: 60
    barrido-ms: 30000
  ia:
    local:
      # Apagada por omision a proposito: sin esto la aplicacion es la de
      # siempre, y ese es justamente el punto. Se prende con
      # FORJA_IA_HABILITADA=true y Ollama corriendo en la maquina.
      habilitada: ${FORJA_IA_HABILITADA:false}
      url: ${FORJA_IA_URL:http://localhost:11434}
      # El nombre lleva dos puntos, que en un marcador de posicion separa el
      # valor por omision. Spring parte en el PRIMERO, asi que el resto
      # -incluidos sus dos puntos- es el valor por omision y esto funciona.
      modelo: ${FORJA_IA_MODELO:gemma3:4b}
    vision:
      # Lectura de la foto de un diagrama dibujado. Bandera aparte de la del
      # bloque local a proposito: esa corre en esta maquina y es gratis, y esta
      # manda la imagen a un servicio de pago fuera de ella. Sin clave no se
      # registra aunque la bandera este prendida.
      habilitada: ${FORJA_VISION_HABILITADA:false}
      url: ${FORJA_VISION_URL:https://generativelanguage.googleapis.com}
      modelo: ${FORJA_VISION_MODELO:gemini-3.1-flash-lite}
      clave: ${FORJA_VISION_CLAVE:}

server:
  port: 8080

logging:
  level:
    bo.forja: DEBUG
